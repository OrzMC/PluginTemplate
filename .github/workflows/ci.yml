name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify
        run: ./gradlew --no-daemon clean check build
      - name: Inspect plugin JAR
        run: bash scripts/inspect-jar.sh
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: plugin-jar
          path: plugin-paper/build/libs/*.jar
          if-no-files-found: error
