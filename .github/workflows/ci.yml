name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify
        run: ./gradlew --no-daemon clean check build
      - name: Upload JUnit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-reports
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/**
          if-no-files-found: ignore
      - name: Validate Paper smoke runner syntax
        run: python3 -m py_compile scripts/smoke-paper.py
      - name: Test Paper smoke EULA fail-closed guard
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Inspect plugin JAR
        run: bash scripts/inspect-jar.sh
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: plugin-jar
          path: plugin-paper/build/libs/*.jar
          if-no-files-found: error

  paper-smoke:
    # One-time maintainer authorization after accepting the Minecraft EULA.
    if: ${{ vars.MINECRAFT_EULA_ACCEPTED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/download-artifact@v7
        with:
          name: plugin-jar
          path: dist
      - name: Run isolated Paper smoke
        env:
          MINECRAFT_EULA_ACCEPTED: ${{ vars.MINECRAFT_EULA_ACCEPTED }}
        run: |
          plugin_jar="$(find dist -type f -name 'OrzMCPluginTemplate-*.jar' -print -quit)"
          test -n "$plugin_jar"
          python3 scripts/smoke-paper.py \
            --plugin-jar "$plugin_jar" \
            --work-dir "$RUNNER_TEMP/paper-smoke"
      - name: Upload Paper smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-smoke-evidence
          path: |
            ${{ runner.temp }}/paper-smoke/smoke-report.json
            ${{ runner.temp }}/paper-smoke/logs/server.log
            ${{ runner.temp }}/paper-smoke/server.properties
            ${{ runner.temp }}/paper-smoke/eula.txt
          if-no-files-found: warn
