name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify
        run: ./gradlew --no-daemon clean check build
      - name: Validate Paper smoke runner syntax
        run: python3 -m py_compile scripts/smoke-paper.py
      - name: Inspect plugin JAR
        run: bash scripts/inspect-jar.sh
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: plugin-jar
          path: plugin-paper/build/libs/*.jar
          if-no-files-found: error

  paper-smoke:
    # One-time maintainer authorization after accepting the Minecraft EULA.
    if: ${{ vars.MINECRAFT_EULA_ACCEPTED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/download-artifact@v7
        with:
          name: plugin-jar
          path: dist
      - name: Run isolated Paper smoke
        run: |
          python3 scripts/smoke-paper.py \
            --plugin-jar dist/OrzMCPluginTemplate-0.1.0-SNAPSHOT.jar \
            --work-dir "$RUNNER_TEMP/paper-smoke"
      - name: Upload Paper smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-smoke-evidence
          path: ${{ runner.temp }}/paper-smoke/
          if-no-files-found: warn
